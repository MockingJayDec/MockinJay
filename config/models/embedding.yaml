# Embedding Models Configuration

default: "mpnet-multilingual"

models:
  mpnet-multilingual:
    class: "MPNetEmbedder"
    dimension: 768
    model_path: "paraphrase-multilingual-mpnet-base-v2"
    batch_size: 32
    device: "cpu"
    description: "현재 사용 중인 다국어 임베딩 모델 (한국어 지원)"

